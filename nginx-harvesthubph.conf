# HarvestHub Nginx Configuration for harvesthubph.app
# Place this file in: /etc/nginx/sites-available/harvesthubph.app
# Then create symlink: sudo ln -s /etc/nginx/sites-available/harvesthubph.app /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name harvesthubph.app www.harvesthubph.app;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    server_name harvesthubph.app www.harvesthubph.app;

    # SSL Configuration (adjust paths to your SSL certificates)
    ssl_certificate /etc/ssl/certs/harvesthubph.app.crt;
    ssl_certificate_key /etc/ssl/private/harvesthubph.app.key;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # CRITICAL: Allow large file uploads (EMERGENCY: Increased for defense)
    client_max_body_size 600M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Static files from public directory
    location /images/ {
        alias /var/www/harvesthubph/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /fonts/ {
        alias /var/www/harvesthubph/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /locales/ {
        alias /var/www/harvesthubph/public/locales/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Next.js static files
    location /_next/static/ {
        alias /var/www/harvesthubph/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other root files
    location = /favicon.ico {
        alias /var/www/harvesthubph/public/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPECIAL: Chat upload endpoint - extra large limits and long timeouts
    location /api/chat/upload {
        client_max_body_size 600M;
        client_body_timeout 900s;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js API routes and pages - proxy to Node.js server
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts (increased for large file uploads)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings (optimized for large uploads)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Logging
    access_log /var/log/nginx/harvesthubph.app.access.log;
    error_log /var/log/nginx/harvesthubph.app.error.log;
}

# Additional server block for harvesthubph.com
server {
    listen 80;
    server_name harvesthubph.com www.harvesthubph.com;

    # Increase client body size limit for EMERGENCY MODE
    client_max_body_size 600M;
    
    # Increase timeouts for large file uploads
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    
    # Buffer settings for large uploads
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase proxy timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}